name: Daybreak
options:
  bundleIdPrefix: app.daybreak
  deploymentTarget:
    iOS: '26.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGN_STYLE: Automatic
targets:
  Daybreak:
    type: application
    platform: iOS
    sources:
      - path: Daybreak
        excludes: [Web, Sounds]
    resources:
      - path: Daybreak/Web
        type: folder
      - path: Daybreak/Sounds
        type: folder
    info:
      path: Daybreak/Info.plist
      properties:
        CFBundleDisplayName: Daybreak
        NSAlarmKitUsageDescription: Daybreak schedules your wake-up alarm and follow-up alarms until you finish your morning routine.
        NSCameraUsageDescription: Scan your private wake-up QR code to finish an out-of-bed mission.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIRequiresFullScreen: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.daybreak.alarm
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: '0.1.0'
        CURRENT_PROJECT_VERSION: '1'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  Daybreak:
    build:
      targets:
        Daybreak: all
    run:
      config: Debug
